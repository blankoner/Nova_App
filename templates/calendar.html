<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova — Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --violet: #6B21FF;
      --violet-dark: #4A0FCC;
      --violet-light: #9B5FFF;
      --white: #ffffff;
      --off-white: #F7F7F9;
      --ink: #0D0D0D;
      --muted: #999;
      --border: #E2E2E6;
      --highlight: #e9ddff;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      display: grid;
      margin:0px;
      grid-template-columns: 90px 52% 1fr;
      height: 100vh;
      background: white;
    }
    .sidebar {
      background: #0A0A0F;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 1rem;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-top,
    .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .sidebar-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--violet);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
    }
    .side-item {
      width: 100%;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.9rem 0.4rem;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.25s;
      font-size: 0.72rem;
      font-family: 'DM Sans', sans-serif;
    }
    .side-item span:first-child {
      font-size: 1.1rem;
    }
    .side-item:hover {
      background: rgba(255,255,255,0.06);
      color: white;
      transform: translateY(-1px);
    }
    .side-item.active {
      background: var(--violet);
      color: white;
      box-shadow: 0 10px 30px rgba(107,33,255,0.3);
    }
    .left {
      background: var(--violet);
      background-image:
        radial-gradient(ellipse at 20% 80%, var(--violet-light) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 10%, #8B3FFF 0%, transparent 50%);
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 3rem;
      position: relative;
      overflow: hidden;
    }
    .left::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.9;
    }
    .logo-cross {
      font-size: 1.2rem;
      font-weight: 300;
    }
    .left-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 0;
    }
    .headline {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 800;
      line-height: 1.0;
      margin-bottom: 1.2rem;
    }
    .headline em {
      font-style: italic;
      font-weight: 700;
    }
    .subline {
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.65;
      opacity: 0.8;
      max-width: 340px;
    }
    .right {
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      overflow-y: auto;
    }
    .calendar-panel {
      width: 100%;
      max-width: 430px;
      background: var(--off-white);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(107,33,255,0.08);
      padding: 2.2rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .calendar-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 0.2rem;
    }
    .calendar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .calendar-controls button {
      background: var(--violet);
      color: var(--white);
      border: none;
      border-radius: 7px;
      padding: 0.5rem 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .calendar-controls button:hover {
      background: var(--violet-dark);
    }
    .calendar-month {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--violet-dark);
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.04em;
    }
    .calendar-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(107,33,255,0.04);
    }
    .calendar-table th, .calendar-table td {
      width: 14.28%;
      text-align: center;
      padding: 0.7rem 0.2rem;
      font-size: 1rem;
      font-family: 'DM Sans', sans-serif;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border-radius: 8px;
      position: relative;
    }
    .calendar-table th {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      background: var(--off-white);
      cursor: default;
      padding-bottom: 0.3rem;
    }
    .calendar-table td.selected {
      background: var(--violet-light);
      color: var(--white);
      font-weight: 700;
    }
    .calendar-table td.today {
      border: 2px solid var(--violet);
      background: var(--highlight);
      color: var(--violet-dark);
      font-weight: 700;
    }
    .calendar-table td:not(.selected):hover {
      background: var(--highlight);
      color: var(--violet-dark);
    }
    .calendar-table td.disabled {
      color: #ccc;
      background: transparent;
      cursor: not-allowed;
    }
    .selected-dates-list {
      margin-top: 1.2rem;
      font-size: 0.98rem;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
    }
    .selected-dates-list span {
      background: var(--violet-light);
      color: var(--white);
      border-radius: 6px;
      padding: 0.2rem 0.7rem;
      margin-right: 0.5rem;
      margin-bottom: 0.3rem;
      display: inline-block;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <!-- ─────────────── SIDEBAR ─────────────── -->
<div class="sidebar">

  <div class="sidebar-top">

    <div class="sidebar-logo">N</div>

    <button class="side-item active"
      onclick="window.location.href='index.html'">
      <span>🏠</span>
      <span>Home</span>
    </button>

<button class="side-item" id="pomodoro-sidebar-btn">
  <span>🧠</span>
  <span>Pomodoro</span>
</button>

    <button class="side-item"
      onclick="window.location.href='todo.html'">
      <span>🎓</span>
      <span>To-Do List</span>
    </button>


    <button class="side-item"
      onclick="window.location.href='careers.html'">
      <span>💼</span>
      <span>Careers</span>
    </button>



  </div>

  <div class="sidebar-bottom">

    <button class="side-item"
      onclick="window.location.href='settings.html'">
      <span>⚙️</span>
      <span>Settings</span>
    </button>

  </div>

</div>
  <!-- ─────────────── LEFT ─────────────── -->
  <div class="left">
    <div class="logo">
      <span class="logo-cross">+</span>
      Nova
    </div>
    <div class="left-body">
      <h1 class="headline">
        Your<br>
        <em>Calendar</em>
      </h1>
      <p class="subline">
        Mark important dates and keep track of your events and deadlines.
      </p>
    </div>
  </div>
  <!-- ─────────────── RIGHT ─────────────── -->
  <div class="right">
    <div class="calendar-panel">
      <div class="calendar-title">Calendar</div>
      <div class="calendar-controls">
        <button id="prev-month">&lt;</button>
        <span class="calendar-month" id="calendar-month"></span>
        <button id="next-month">&gt;</button>
      </div>
      <table class="calendar-table" id="calendar-table">
        <thead>
          <tr>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
            <th>Sun</th>
          </tr>
        </thead>
        <tbody id="calendar-body"></tbody>
      </table>
      <div class="selected-dates-list" id="selected-dates-list">
        <strong>Selected dates:</strong>
        <div id="selected-dates"></div>
      </div>
    </div>
  </div>
  <script>
    // Calendar logic
    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    let today = new Date();
    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();

    // Store selected dates as ISO strings
    function getSelectedDates() {
      return JSON.parse(localStorage.getItem('nova_calendar_dates') || '[]');
    }
    function saveSelectedDates(dates) {
      localStorage.setItem('nova_calendar_dates', JSON.stringify(dates));
    }

    function isSameDay(date1, date2) {
      return date1.getFullYear() === date2.getFullYear() &&
             date1.getMonth() === date2.getMonth() &&
             date1.getDate() === date2.getDate();
    }

    function renderCalendar(month, year) {
      const calendarBody = document.getElementById('calendar-body');
      const calendarMonth = document.getElementById('calendar-month');
      calendarBody.innerHTML = '';
      calendarMonth.textContent = `${monthNames[month]} ${year}`;

      // First day of the month (Monday = 1, Sunday = 0)
      let firstDay = new Date(year, month, 1);
      let startDay = (firstDay.getDay() + 6) % 7; // Make Monday first
      let daysInMonth = new Date(year, month + 1, 0).getDate();

      let selectedDates = getSelectedDates();
      let row = document.createElement('tr');
      // Fill empty cells before first day
      for (let i = 0; i < startDay; i++) {
        let cell = document.createElement('td');
        cell.className = 'disabled';
        row.appendChild(cell);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        if ((row.children.length) === 7) {
          calendarBody.appendChild(row);
          row = document.createElement('tr');
        }
        let cell = document.createElement('td');
        let cellDate = new Date(year, month, day);
        cell.textContent = day;

        // Highlight today
        if (isSameDay(cellDate, today)) {
          cell.classList.add('today');
        }
        // Highlight selected
        if (selectedDates.includes(cellDate.toISOString().slice(0,10))) {
          cell.classList.add('selected');
        }
        cell.addEventListener('click', function() {
          let iso = cellDate.toISOString().slice(0,10);
          let selected = getSelectedDates();
          if (selected.includes(iso)) {
            selected = selected.filter(d => d !== iso);
          } else {
            selected.push(iso);
          }
          saveSelectedDates(selected);
          renderCalendar(currentMonth, currentYear);
          renderSelectedDates();
        });
        row.appendChild(cell);
      }
      // Fill empty cells after last day
      while (row.children.length < 7) {
        let cell = document.createElement('td');
        cell.className = 'disabled';
        row.appendChild(cell);
      }
      calendarBody.appendChild(row);
    }

    function renderSelectedDates() {
      const selectedDiv = document.getElementById('selected-dates');
      let selected = getSelectedDates();
      selectedDiv.innerHTML = '';
      if (selected.length === 0) {
        selectedDiv.innerHTML = '<span style="color:var(--muted);font-size:0.97rem;">None</span>';
        return;
      }
      selected.sort();
      selected.forEach(dateStr => {
        const d = new Date(dateStr);
        const label = `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        const span = document.createElement('span');
        span.textContent = label;
        selectedDiv.appendChild(span);
      });
    }

    document.getElementById('prev-month').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar(currentMonth, currentYear);
    });
    document.getElementById('next-month').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar(currentMonth, currentYear);
    });

    renderCalendar(currentMonth, currentYear);
    renderSelectedDates();
  </script>
</body>
</html>
