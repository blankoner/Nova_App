<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logos/logo-couleur.png') }}">
  <title>Nova — Find Your Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon" aria-hidden="true">
          <img src="{{ url_for('static', filename='logos/Logo Blanc.png') }}" width="70px">
        </div><br>
        <div class="brand-copy">
          <p class="brand-eyebrow">NOVA</p>
          <!-- path should have gradient from purple to white -->
          <h1 class="brand-title">Find your <span class="gradient-word">path</span>.</h1>
        </div>
      </div>

      <div class="form-panel signup-panel active">
        <div class="input-field">
          <input type="text" id="inp-name" placeholder="Full Name">
        </div>
        <div class="input-field">
          <input type="email" id="inp-email" placeholder="Email">
        </div>
        <div class="input-field">
          <input type="password" id="inp-pass" placeholder="Password">
        </div>
        <button class="btn-primary" onclick="handleSignup()">Sign Up</button>
        <a class="btn-ghost" href="/dashboard?name=Guest">Continue without account</a>

        <div class="or-line">or continue with</div>

        <div class="social-row">
          <button type="button" class="social-btn" aria-label="Continue with Google">
            <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M43.6 20.5H42V20H24v8h11.4c-1.1 5.7-5.8 9.8-11.4 9.8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8.1 2.9l5.7-5.7C34.4 7.5 29.6 5 24 5 12.9 5 4 13.9 4 25s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.8z"/>
            </svg>
          </button>
          <button type="button" class="social-btn" aria-label="Continue with Apple">
            <svg viewBox="0 0 384 512" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M318.7 268.3c.3-61.8 50.5-91.5 52.8-93.1-28.8-42.3-73.7-48.1-89.7-48.7-38.2-3.9-74.6 22.6-94.1 22.6-19.5 0-49.6-22-81.6-21.4-41.9.6-80.6 24.4-102.1 62-43.7 76-11.2 188.2 31.4 249.5 20.8 30.8 45.6 65.4 78 64 31.7-1.4 43.7-20.5 81.9-20.5 38.1 0 49.3 20.5 82.6 19.8 33.9-.7 55.4-31.6 76.1-62.7 24.1-35.1 34-69 34.4-70.8-.8-.3-66.3-25.4-66.6-100.7zM255.2 0c-10.1 11.7-21.8 22.3-35.7 30.7-15.9 9.5-33 16-51.3 16.8-4.8-14.2-7.6-28.9-7.6-43.8 0-19.8 5.3-31.1 18.2-48.5C190.1 14.5 218.3-1.7 236.9.4c9 1 17.6 5 25.5 10.6 1.9 1.3 3.3 2.9 4.6 4.5 10.1 12.3 16.3 26.4 17.1 42.4.1 3 .1 6-.3 9.4z"/>
            </svg>
          </button>
          <button type="button" class="social-btn" aria-label="Continue with Discord">
            <img src="{{ url_for('static', filename='logos/discord.png') }}" alt="Discord" width="24" height="24">
          </button>
        </div>

        <p class="login-line">Already have an account? <a href="#" onclick="showLogin(); return false;">Log in</a></p>
      </div>

      <div class="form-panel login-panel">
        <div class="input-field">
          <input type="email" id="login-email" placeholder="Email">
        </div>
        <div class="input-field">
          <input type="password" id="login-pass" placeholder="Password">
        </div>
        <button class="btn-primary" onclick="handleLogin()">Log In</button>
        <a class="btn-ghost" href="/dashboard?name=Guest">Continue without account</a>

        <p class="login-line">New here? <a href="#" onclick="showSignup(); return false;">Create account</a></p>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
