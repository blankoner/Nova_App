<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logos/logo-couleur.png') }}">
  <title>Social — Nova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/game-social.css') }}">
</head>
<body>

<!-- ── TOPBAR ─────────────────────────────────────────────── -->
<header class="topbar">
  <a href="/dashboard?name={{ name }}" class="back-link" aria-label="Back to dashboard">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 7 H2"/><path d="M6 3 L2 7 L6 11"/>
    </svg>
    <span>Back</span>
  </a>

  <a href="/" class="brand-mark">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 0 L13.6 9.4 L23 11 L13.6 12.6 L12 22 L10.4 12.6 L1 11 L10.4 9.4 Z"/>
    </svg>
    Nova
  </a>

  <a href="/skills" class="skills-link">My skills →</a>
</header>

<div class="game-wrap">

  <!-- Game intro -->
  <div class="game-intro">
    <p class="eyebrow">Mini-game 02 — Social</p>
    <p class="game-tagline">Read people, choose how to respond — there's no perfect answer</p>
  </div>

  <!-- Progress (dots + scene counter, filled by JS) -->
  <div class="social-progress" id="socialProgress"></div>

  <!-- Stage: scenes, then the result screen, all rendered by JS -->
  <div class="social-stage" id="socialStage">
    <div class="social-loading">Loading scenes…</div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/game-social.js') }}"></script>
</body>
</html>
