<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your path</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .chat-box {
      height: 420px;
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid #dee2e6;
    }
    .bubble {
      max-width: 78%;
      padding: 0.6rem 1rem;
      border-radius: 18px;
      margin-bottom: 0.5rem;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .bubble-ai   { background: #e9ecef; color: #212529; border-bottom-left-radius: 4px; }
    .bubble-user { background: #0d6efd; color: #fff;    border-bottom-right-radius: 4px; }
    .typing { opacity: 0.5; font-style: italic; font-size: 0.88rem; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width:680px">
  <div class="text-center mb-4">
    <h1 class="h3 fw-bold">Find Your path</h1>
    <p class="text-muted">Please answer for a few questions and I will hekp You find a job.</p>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="chat-box mb-3" id="chatBox">
        <div class="d-flex justify-content-start">
          <div class="bubble bubble-ai">
            BEGIN
          </div>
        </div>
      </div>

      <div id="inputArea" class="d-none">
        <div class="input-group">
          <input type="text" id="userInput" class="form-control" placeholder="Wpisz odpowiedź…" autocomplete="off">
          <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
      </div>

      <div id="startArea" class="text-center">
        <button class="btn btn-success btn-lg px-5" onclick="startChat()">Begin</button>
      </div>
    </div>
  </div>

  <!-- Wyniki profilu (ukryte do końca wywiadu) -->
  <div id="profileCard" class="card shadow-sm border-0 mt-4 d-none">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-3">Your profile</h5>
      <div id="profileContent"></div>
      <a href="/wyniki" class="btn btn-primary mt-3 w-100">See matching offers</a>
    </div>
  </div>
</div>

<script>
  const chatBox = document.getElementById("chatBox");

  function addBubble(text, role) {
    const align = role === "user" ? "justify-content-end" : "justify-content-start";
    const cls   = role === "user" ? "bubble-user" : "bubble-ai";
    chatBox.innerHTML += `
      <div class="d-flex ${align}">
        <div class="bubble ${cls}">${text}</div>
      </div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    chatBox.innerHTML += `<div id="typing" class="typing ms-1">AI pisze…</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  async function startChat() {
    document.getElementById("startArea").classList.add("d-none");
    showTyping();

    const res  = await fetch("/start", { method: "POST" });
    const data = await res.json();
    removeTyping();
    addBubble(data.message, "ai");
    document.getElementById("inputArea").classList.remove("d-none");

    document.getElementById("userInput").addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });
  }

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const text  = input.value.trim();
    if (!text) return;

    addBubble(text, "user");
    input.value = "";
    document.getElementById("sendBtn").disabled = true;
    showTyping();

    const res  = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeTyping();
    document.getElementById("sendBtn").disabled = false;

    if (data.message) addBubble(data.message, "ai");

    if (data.done && data.profile) {
      document.getElementById("inputArea").classList.add("d-none");
      showProfile(data.profile);
    }

    input.focus();
  }

  function showProfile(p) {
    const labels = {
      age: "Age", status: "Status", type: "Searching",
      availability: "Availability", hobbies: "Hobbies"
    };
    let html = '<ul class="list-group list-group-flush">';
    for (const [k, v] of Object.entries(p)) {
      const val = Array.isArray(v) ? v.join(", ") : v;
      html += `<li class="list-group-item d-flex justify-content-between">
        <span class="text-muted">${labels[k] ?? k}</span>
        <strong>${val}</strong></li>`;
    }
    html += "</ul>";
    document.getElementById("profileContent").innerHTML = html;
    document.getElementById("profileCard").classList.remove("d-none");
  }
</script>
</body>
</html>
