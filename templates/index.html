<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logos/logo-couleur.png') }}">
  <title>Nova — Find Your Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2 L13.6 10.8 L22 12.4 L13.6 14 L12 22 L10.4 14 L2 12.4 L10.4 10.8 Z"/>
          </svg>
        </div>
        <div class="brand-copy">
          <p class="brand-eyebrow">NOVA</p>
          <h1 class="brand-title">Find your path.</h1>
        </div>
      </div>

      <div class="form-panel signup-panel active">
        <div class="input-field">
          <input type="text" id="inp-name" placeholder="Full Name">
        </div>
        <div class="input-field">
          <input type="email" id="inp-email" placeholder="Email">
        </div>
        <div class="input-field">
          <input type="password" id="inp-pass" placeholder="Password">
        </div>
        <button class="btn-primary" onclick="handleSignup()">Sign Up</button>

        <div class="or-line">or continue with</div>

        <div class="social-row">
          <button type="button" class="social-btn" aria-label="Continue with Google">G</button>
          <button type="button" class="social-btn" aria-label="Continue with Apple"></button>
          <button type="button" class="social-btn" aria-label="Continue with Discord">D</button>
        </div>

        <p class="login-line">Already have an account? <a href="#" onclick="showLogin(); return false;">Log in</a></p>
      </div>

      <div class="form-panel login-panel">
        <div class="input-field">
          <input type="email" id="login-email" placeholder="Email">
        </div>
        <div class="input-field">
          <input type="password" id="login-pass" placeholder="Password">
        </div>
        <button class="btn-primary" onclick="handleLogin()">Log In</button>

        <p class="login-line">New here? <a href="#" onclick="showSignup(); return false;">Create account</a></p>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
